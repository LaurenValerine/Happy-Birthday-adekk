<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🐸 Frog Route</title>

    <link rel="stylesheet" href="../css/frog.css">
</head>

<body>

    <!-- =========================
         FROG PUZZLE PAGE
    ========================== -->

    <main class="frog-page">

        <!-- Frog Guide -->
        <section class="frog-guide">

            <div class="frog-image">
                🐸
            </div>

        </section>


        <!-- Puzzle -->
        <section class="puzzle-section">

            <div class="puzzle-card">

                <span class="puzzle-label">
                    RIDDLE 01
                </span>

                <h1>
                    Teka-Teki
                </h1>

                <p class="riddle">
                    Aku punya kaki, tetapi tidak bisa berjalan.
                    Aku bisa hidup di air dan di darat.
                    Siapakah aku?
                </p>


                <!-- Answer -->
                <div class="answer-area">

                    <input
                        type="text"
                        id="answer"
                        placeholder="Masukkan jawaban..."
                        autocomplete="off"
                    >

                    <button id="submit-answer">
                        BUKA
                    </button>

                </div>


                <!-- Result -->
                <p id="result"></p>

            </div>

        </section>


        <!-- Next -->
        <section
            id="next-section"
            class="hidden"
        >

            <p>
                Jawaban benar.
            </p>

            <button id="next-button">
                LANJUT →
            </button>

        </section>

    </main>


    <script src="../js/frog.js"></script>

</body>
</html>
