<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Experience</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         LOADING
    ========================== -->
    <section id="loading-screen">
        <div class="loading-content">
            <p>Loading...</p>
        </div>
    </section>


    <!-- =========================
         OPENING
    ========================== -->
    <main id="opening" class="hidden">

        <!-- Petasan + tulisan -->
        <section id="firework-section">

            <div id="fireworks"></div>

            <div class="opening-text">
                <h1>Ohhh ini yang lagi ultahh</h1>
            </div>

        </section>


        <!-- =========================
             MAU LANJUT?
        ========================== -->
        <section id="continue-section" class="hidden">

            <div class="dialog-box">

                <p>mau lanjut gaa?</p>

                <div class="choice-buttons">
                    <button id="yes-button">YA</button>
                    <button id="no-button">TIDAK</button>
                </div>

            </div>

        </section>


        <!-- =========================
             TYPING TEXT
        ========================== -->
        <section id="message-section" class="hidden">

            <div class="dialog-box">

                <p id="typing-text"></p>

            </div>

        </section>


        <!-- =========================
             PILIHAN
        ========================== -->
        <section id="path-section" class="hidden">

            <h2>Pilih salah satu</h2>

            <p>
                TIDAK BISA DUA.
            </p>

            <div class="path-buttons">

                <button id="frog-button">
                    🐸
                    <span>KATAK</span>
                </button>

                <button id="jhope-button">
                    <span>J-HOPE</span>
                </button>

            </div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script src="js/script.js"></script>

</body>
</html>
